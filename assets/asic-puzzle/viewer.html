<!doctype html><html><head><meta charset='utf-8'></head>
<body class='replay-view' style='margin:0;background:#fff;font-family:monospace'>
<canvas id='cv' width='__W2__' height='__H2__'></canvas>
<div id='playback'></div>
<div class='replay-status'>
<div id='lab' style='padding:8px 12px 2px;font-size:14px;white-space:pre'></div>
<div id='signals'></div>
<div class='io-readout'><pre class='input-sequence' id='input-bits' tabindex='0' aria-label='Input bit sequence'></pre><div id='ob'></div></div>
</div>
<script>
function dec(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
var xy=new Uint16Array(dec('__XY__').buffer),cnt=new Uint16Array(dec('__CNT__').buffer),
    pnet=new Uint16Array(dec('__PNET__').buffer),sig=dec('__SIG__'),bits=dec('__BITS__'),
    titles=__TITLES__,olines=__OLINES__,leg=__LEG__,ileg=__ILEG__,SN=__SNET__,
    BPF=__BPF__,W=__W__,H=__H__,XO=__XO__,sx=W/65535,sy=H/65535;
var cv=document.getElementById('cv'),viewWidth=H,viewHeight=W+64;
cv.width=2*viewWidth;cv.height=2*viewHeight;cv.style.width=viewWidth+'px';
var ctx=cv.getContext('2d');ctx.scale(2,2);
// Clockwise die coordinates; labels remain upright.
function point(x,y){return [H-y,x-XO+32];}
var currentFrame=0;
var bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
var bc=bg.getContext('2d');bc.scale(2,2);
var pb=new Path2D(),netIds=[],netPath={};
var markPath=new Path2D();
markPath.addPath(new Path2D(__MARK__),new DOMMatrix([0,1,-1,0,H,32-XO]));
for(var p=0,v=0;p<cnt.length;v+=cnt[p],p++){
  var isSig=sig[p>>3]>>(7-(p&7))&1,n=pnet[p];
  var P=isSig?(netPath[n]||(netIds.push(n),netPath[n]=new Path2D())):pb;
  P.moveTo(...point(XO+xy[2*v]*sx,H-xy[2*v+1]*sy));
  for(var k=1;k<cnt[p];k++)P.lineTo(...point(XO+xy[2*(v+k)]*sx,H-xy[2*(v+k)+1]*sy));
  P.closePath();}
function sceneColors(){return document.documentElement.dataset.theme==='dark'
  ? {context:'#25364b',mark:'#8294ad',off:'#789aca',on:'#ffb24a',yes:'#64d39b',no:'#f28bae'}
  : {context:'#edeff1',mark:'#76869c',off:'#59739b',on:'#e07b00',yes:'#0b8043',no:'#c62660'};}
function drawBackground(){
  bc.clearRect(0,0,viewWidth,viewHeight);bc.fillStyle=sceneColors().context;bc.fill(pb);
  bc.fillStyle=sceneColors().mark;bc.fill(markPath);
}
drawBackground();
function draw(f){
  currentFrame=f;
  var colors=sceneColors();
  ctx.clearRect(0,0,viewWidth,viewHeight);ctx.drawImage(bg,0,0,viewWidth,viewHeight);
  var off=new Path2D(),on=new Path2D(),base=f*BPF;
  for(var i=0;i<netIds.length;i++){var n=netIds[i];
    ((bits[base+(n>>3)]>>(7-(n&7)))&1?on:off).addPath(netPath[n]);}
  ctx.fillStyle=colors.off;ctx.fill(off);ctx.fillStyle=colors.on;ctx.fill(on);
  var sOn=(bits[base+(SN>>3)]>>(7-(SN&7)))&1;
  if(netPath[SN]){ctx.lineWidth=1.2;ctx.strokeStyle=sOn?colors.yes:colors.no;ctx.stroke(netPath[SN]);}
  ctx.font='bold 14px monospace';ctx.textAlign='center';
  function lab1(L,bottom){
    var b=(bits[base+(L[1]>>3)]>>(7-(L[1]&7)))&1,s=L[0]+'='+b,
        c=L[0]=='success'?(b?colors.yes:colors.no):(b?colors.on:colors.off);
    var pad=point(XO+L[2],L[3]),tx=Math.max(ctx.measureText(s).width/2+4,
        Math.min(viewWidth-ctx.measureText(s).width/2-4,H-L[4])),ty=bottom?viewHeight-8:18;
    ctx.strokeStyle=c;ctx.lineWidth=1;ctx.globalAlpha=0.45;
    ctx.beginPath();ctx.moveTo(tx,bottom?ty-15:ty+5);ctx.lineTo(...pad);ctx.stroke();
    ctx.globalAlpha=1;ctx.fillStyle=c;
    ctx.beginPath();ctx.arc(...pad,2.5,0,6.284);ctx.fill();
    ctx.fillText(s,tx,ty);}
  for(var i=0;i<leg.length;i++)lab1(leg[i],true);
  for(var i=0;i<ileg.length;i++)lab1(ileg[i],false);
  var lines=titles[f].split('\n');
  var signals=lines.filter(function(line){return /^(en|clk|rst_n|success)=/.test(line);});
  document.getElementById('lab').textContent=lines[0];
  document.getElementById('signals').textContent=signals.join('  ');
  window.showInputBits(document.getElementById('input-bits'),lines.slice(1).filter(function(line){return !/^(en|clk|rst_n|success)=/.test(line);}).join('').replace(/\s/g,''));
  document.getElementById('ob').textContent=olines[f].replace('\ntext=', '   Output: ');
}
window.createPlayback(document.getElementById('playback'), titles.length, draw);
window.addEventListener('asic-theme-change',function(){drawBackground();draw(currentFrame);});
</script>
</body></html>
